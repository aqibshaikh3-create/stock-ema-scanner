name: Run Daily Stock Scanner
on:
  schedule:
    - cron: '30 11 * * 1-5' # Triggers automatically Monday-Friday at 5:00 PM IST
  workflow_dispatch: # Allows manual trigger button clicks

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository Files
      uses: actions/checkout@v4 # Upgraded from v3 to fix the deprecation warning

    - name: Configure Python runtime environment
      uses: actions/setup-python@v5 # Upgraded from v4 to fix the deprecation warning
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy requests

    - name: Run Analytics Crossover Engine
      env:
        UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
      run: python updater.py
