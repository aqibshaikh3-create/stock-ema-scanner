<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMA Crossover Filter Dashboard</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans p-6 min-h-screen">

    <div class="max-w-5xl mx-auto">
        <header class="mb-6 pb-4 border-b border-gray-800">
            <h1 class="text-3xl font-extrabold text-teal-400">📊 Premium Stock Crossover Filter</h1>
            <p class="text-gray-400 text-sm mt-1">Scanning 3 years of daily historical data for active NSE stocks. Updated daily at 5:00 PM IST.</p>
        </header>

        <!-- Main Display Table Card -->
        <div class="bg-gray-800 rounded-lg shadow-lg border border-gray-700 overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-700 text-gray-200 text-xs font-semibold uppercase tracking-wider">
                        <th class="p-4">Trading Symbol</th>
                        <th class="p-4 text-center">20 & 50 EMA Strategy</th>
                        <th class="p-4 text-center">Total 20/50 Crosses</th>
                        <th class="p-4 text-center">100 & 200 EMA Strategy</th>
                        <th class="p-4 text-center">Total 100/200 Crosses</th>
                    </tr>
                </thead>
                <tbody id="stock-table-rows" class="text-sm divide-y divide-gray-700">
                    <tr>
                        <td colspan="5" class="p-8 text-center text-gray-400 font-medium">⏳ Fetching latest data snapshot from the server...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Use a clean URL without aggressive error handlers to prevent dashboard freezes
        fetch('data.json')
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('stock-table-rows');
                tbody.innerHTML = ''; // Clear loading row

                if (!data || data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-gray-400">⚠️ No stocks currently meet the strict 100% win-rate crossover criteria. Check back after market close.</td></tr>`;
                    return;
                }

                data.forEach(stock => {
                    const badge20_50 = stock.cross_20_50 === 'PASSED' ? 'bg-green-500/20 text-green-400 font-bold' : 'bg-gray-700 text-gray-500';
                    const badge100_200 = stock.cross_100_200 === 'PASSED' ? 'bg-green-500/20 text-green-400 font-bold' : 'bg-gray-700 text-gray-500';

                    const row = `
                        <tr class="hover:bg-gray-750">
                            <td class="p-4 font-bold text-white">${stock.symbol}</td>
                            <td class="p-4 text-center"><span class="px-3 py-1 rounded text-xs ${badge20_50}">${stock.cross_20_50}</span></td>
                            <td class="p-4 text-center font-mono text-gray-300">${stock.count_20_50}</td>
                            <td class="p-4 text-center"><span class="px-3 py-1 rounded text-xs ${badge100_200}">${stock.cross_100_200}</span></td>
                            <td class="p-4 text-center font-mono text-gray-300">${stock.count_100_200}</td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            })
            .catch(err => {
                console.error(err);
                document.getElementById('stock-table-rows').innerHTML = `<tr><td colspan="5" class="p-8 text-center text-yellow-400 font-semibold">⚙️ Data file synchronization in progress. Please refresh this page in a minute.</td></tr>`;
            });
    </script>
</body>
</html>
